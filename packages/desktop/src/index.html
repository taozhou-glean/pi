<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pi Desktop</title>
		<script>
			(() => {
				const saved = localStorage.getItem("pi-desktop-theme") || "system";
				const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.theme = dark ? "dark" : "light";
				document.documentElement.dataset.themePreference = saved;
			})();
		</script>
		<link rel="stylesheet" href="./styles.css" />
	</head>
		<body data-theme="light">
				<div id="app">
					<div class="topbar-left-controls">
						<button
							id="toggle-left-panel"
							class="chrome-button"
							data-left-panel-toggle
							title="Toggle left sidebar"
							aria-label="Toggle left sidebar"
						>
							<svg viewBox="0 0 24 24" aria-hidden="true">
								<rect x="4" y="4" width="16" height="16" rx="3" />
								<path d="M9 4v16" />
							</svg>
						</button>
						<button class="chrome-button" data-new-session title="New chat" aria-label="New chat">
							<svg viewBox="0 0 24 24" aria-hidden="true">
								<path d="M12 20h9" />
								<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
							</svg>
						</button>
					</div>
					<aside class="sidebar">
						<div class="sidebar-chrome">
							<div class="sidebar-window-drag" aria-hidden="true"></div>
						</div>

					<section class="panel session-panel">
					<div class="panel-heading row-heading">
						<span>Projects</span>
						<button id="refresh-sessions" class="icon-button" title="Refresh sessions" aria-label="Refresh sessions">
							<svg viewBox="0 0 24 24" aria-hidden="true">
								<path d="M21 12a9 9 0 0 1-15.3 6.4" />
								<path d="M3 12a9 9 0 0 1 15.3-6.4" />
								<path d="M18 2v4h-4" />
								<path d="M6 22v-4h4" />
							</svg>
						</button>
					</div>
					<div id="session-list" class="session-list"></div>
				</section>

				<details class="sidebar-settings">
					<summary>
						<span class="button-icon" aria-hidden="true">
							<svg viewBox="0 0 24 24">
								<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
								<path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a2 2 0 1 1-4 0V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.4 7A2 2 0 1 1 7.2 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 20.2 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z" />
							</svg>
						</span>
						<span>Settings</span>
					</summary>
					<section class="panel workspace-panel">
						<div class="panel-heading">Workspace</div>
						<label class="field">
							<span>Path</span>
							<input id="cwd-input" spellcheck="false" />
						</label>
						<div class="button-row">
							<button id="change-cwd">Open</button>
						</div>
					</section>

					<section class="panel settings-panel">
						<div class="panel-heading">Model</div>
						<select id="model-select"></select>
						<div id="model-meta" class="meta"></div>
						<div class="panel-heading">Theme</div>
						<select id="theme-select">
							<option value="system">System</option>
							<option value="light">Light</option>
							<option value="dark">Dark</option>
						</select>
					</section>
				</details>
			</aside>

				<main class="main">
					<header class="topbar">
							<div class="topbar-title">
							<div id="session-title" class="session-title">Pi agent session</div>
						</div>
							<div id="run-state" class="run-state idle">Idle</div>
					</header>

				<section class="status-strip">
					<div class="metric">
						<span>Workspace</span>
						<strong id="workspace-name">-</strong>
					</div>
					<div class="metric">
						<span>Session</span>
						<strong id="session-short-id">-</strong>
					</div>
					<div class="metric">
						<span>Messages</span>
						<strong id="message-count">0</strong>
					</div>
					<div class="metric">
						<span>Queue</span>
						<strong id="queue-count">0</strong>
					</div>
				</section>

				<section id="messages" class="messages"></section>

				<form id="composer" class="composer">
					<div class="composer-shell">
							<textarea id="prompt" rows="3" placeholder="Ask for follow-up changes"></textarea>
							<div class="composer-footer">
								<div class="composer-tools">
									<button
										id="composer-add"
										class="composer-menu-trigger composer-icon"
										type="button"
										aria-label="Add context"
										aria-expanded="false"
										aria-controls="composer-add-menu"
									>
										<svg viewBox="0 0 24 24">
											<path d="M12 5v14" />
											<path d="M5 12h14" />
										</svg>
									</button>
									<div id="composer-add-menu" class="composer-menu add-menu" hidden>
										<button type="button" class="composer-command" data-context-kind="files">
											<span class="menu-icon" aria-hidden="true">
												<svg viewBox="0 0 24 24">
													<path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.7-9.7a4 4 0 0 1 5.7 5.7l-9.7 9.7a2 2 0 0 1-2.8-2.8l8.9-8.9" />
												</svg>
											</span>
											<span>Add photos & files</span>
										</button>
										<button type="button" class="composer-command" data-context-kind="workspace">
											<span class="menu-icon" aria-hidden="true">
												<svg viewBox="0 0 24 24">
													<rect x="4" y="4" width="16" height="16" rx="4" />
													<path d="M9 9h6v6H9z" />
													<path d="M9 1.8v2.2M15 1.8v2.2M9 20v2.2M15 20v2.2M1.8 9H4M1.8 15H4M20 9h2.2M20 15h2.2" />
												</svg>
											</span>
											<span>Attach workspace</span>
										</button>
										<div class="composer-menu-separator" role="separator"></div>
										<button type="button" class="composer-command" aria-disabled="true" tabindex="-1">
											<span class="menu-icon" aria-hidden="true">
												<svg viewBox="0 0 24 24">
													<path d="M9 6h11" />
													<path d="M9 12h11" />
													<path d="M9 18h11" />
													<path d="m3.8 6 1.1 1.1L7.2 4.8" />
													<circle cx="5" cy="12" r="1.5" />
													<circle cx="5" cy="18" r="1.5" />
												</svg>
											</span>
											<span>Plan mode</span>
											<span class="menu-switch" aria-hidden="true"></span>
										</button>
										<button type="button" class="composer-command" aria-disabled="true" tabindex="-1">
											<span class="menu-icon" aria-hidden="true">
												<svg viewBox="0 0 24 24">
													<circle cx="12" cy="12" r="8" />
													<circle cx="12" cy="12" r="3" />
													<path d="M12 2v4M22 12h-4M12 22v-4M2 12h4" />
												</svg>
											</span>
											<span>Pursue goal</span>
											<span class="menu-switch on" aria-hidden="true"></span>
										</button>
										<div class="composer-menu-separator" role="separator"></div>
										<button type="button" class="composer-command" aria-disabled="true" tabindex="-1">
											<span class="menu-icon" aria-hidden="true">
												<svg viewBox="0 0 24 24">
													<path d="M12 3 14 8l5 2-5 2-2 5-2-5-5-2 5-2Z" />
													<path d="M18 16v5" />
													<path d="M15.5 18.5h5" />
												</svg>
											</span>
											<span>Create</span>
											<span class="menu-chevron" aria-hidden="true"></span>
										</button>
										<button type="button" class="composer-command" aria-disabled="true" tabindex="-1">
											<span class="menu-icon" aria-hidden="true">
												<svg viewBox="0 0 24 24">
													<circle cx="6" cy="6" r="2.5" />
													<circle cx="18" cy="6" r="2.5" />
													<circle cx="6" cy="18" r="2.5" />
													<circle cx="18" cy="18" r="2.5" />
												</svg>
											</span>
											<span>Plugins</span>
											<span class="menu-chevron" aria-hidden="true"></span>
										</button>
									</div>
									<span id="composer-hint">⌘ Enter to send</span>
								</div>
								<div class="composer-model-wrap">
									<button
										id="composer-model"
										class="composer-menu-trigger composer-model"
										type="button"
										aria-label="Select model"
										aria-expanded="false"
										aria-controls="composer-model-menu"
									></button>
									<div id="composer-model-menu" class="composer-menu model-menu" hidden></div>
								</div>
								<button id="send" type="submit" aria-label="Send">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M12 19V5" />
									<path d="m6 11 6-6 6 6" />
								</svg>
							</button>
						</div>
					</div>
					</form>
				</main>

				<div class="actions">
					<button id="abort" class="chrome-button" title="Abort" aria-label="Abort">
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<rect x="7" y="7" width="10" height="10" rx="2" />
						</svg>
					</button>
					<button id="toggle-right-panel" class="chrome-button" title="Toggle right inspector" aria-label="Toggle right inspector">
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<rect x="4" y="4" width="16" height="16" rx="3" />
							<path d="M15 4v16" />
						</svg>
					</button>
				</div>

				<div id="left-resizer" class="resizer left-resizer" role="separator" aria-label="Resize sidebar" tabindex="0"></div>
				<div id="right-resizer" class="resizer right-resizer" role="separator" aria-label="Resize inspector" tabindex="0"></div>

				<aside class="inspector">
					<section class="panel git-panel">
						<div class="panel-heading row-heading">
							<span>Git</span>
							<button id="refresh-git" class="icon-button" title="Refresh Git" aria-label="Refresh Git">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M21 12a9 9 0 0 1-15.3 6.4" />
									<path d="M3 12a9 9 0 0 1 15.3-6.4" />
									<path d="M18 2v4h-4" />
									<path d="M6 22v-4h4" />
								</svg>
							</button>
						</div>
						<div id="git-branch" class="meta"></div>
						<div id="git-status" class="git-status"></div>
					</section>

				<section class="panel">
					<div class="panel-heading">Run Context</div>
					<div id="context-summary" class="context-summary"></div>
				</section>
			</aside>
		</div>
		<script type="module" src="./renderer.js"></script>
	</body>
</html>
